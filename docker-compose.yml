name: subscribely

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD:?defina no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/Subscribely.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: Host=postgres;Database=subscribely_catalog;Username=subscribely_app;Password=${APP_DB_PASSWORD}
      ConnectionStrings__PostgresAdmin: Host=postgres;Database=postgres;Username=subscribely_provisioner;Password=${PROVISIONER_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      TenantDatabase__ConnectionTemplate: Host=postgres;Database=subscribely_t_{slug};Username=subscribely_app;Password=${APP_DB_PASSWORD}
      Database__MigrateOnStartup: "true"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina no .env}
      Payments__WebhookBaseUrl: http://api:8080
      Payments__FakeGateway__WebhookSecret: ${FAKE_GATEWAY_WEBHOOK_SECRET:?defina no .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
